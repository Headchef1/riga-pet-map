<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GFDGSVJ2Q7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-GFDGSVJ2Q7');
    </script>

    <title>Riga Pet Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- App Styles -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ========== TOP FILTERS ========== -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterMap('all', this)" id="btn-all">All</button>
        <button class="filter-btn" onclick="filterMap('cafe', this)" id="btn-cafe">
            <span class="color-dot" style="background: #007bff"></span> Cafe
        </button>
        <button class="filter-btn" onclick="filterMap('restaurant', this)" id="btn-restaurant">
            <span class="color-dot" style="background: #ffde73"></span> Restaurant
        </button>
        <button class="filter-btn" onclick="filterMap('park', this)" id="btn-park">
            <span class="color-dot" style="background: #28a745"></span> Park
        </button>
        <button class="filter-btn" onclick="filterMap('mall', this)" id="btn-mall">
            <span class="color-dot" style="background: #fd7e14"></span> Mall
        </button>
        <button class="filter-btn" onclick="filterMap('vet', this)" id="btn-vet">
            <span class="color-dot" style="background: #dc3545"></span> Vet
        </button>
    </div>

    <!-- ========== MAP ========== -->
    <div id="mapdiv"></div>
    <div class="map-crosshair" id="crosshair"></div>

    <!-- OK button for location pick mode -->
    <button id="btn-confirm-location" type="button" style="display:none;">OK</button>

    <!-- ========== FLOATING ACTION BUTTONS ========== -->
    <div class="fab-container">
        <button class="fab-btn locate" onclick="findUserLocation()" id="btn-locate">📍</button>
        <button class="fab-btn" onclick="openAddPlaceSheet()" id="btn-add">➕</button>
    </div>

    <!-- ========== BOTTOM SHEET OVERLAY ========== -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeAllSheets()"></div>

    <!-- ========== PLACE DETAILS SHEET ========== -->
    <div class="bottom-sheet" id="placeSheet">
        <div class="sheet-drag-handle"></div>
        <div id="placeSheetContent"></div>
    </div>

    <!-- ========== ADD PLACE SHEET ========== -->
    <div class="bottom-sheet" id="addPlaceSheet">
        <div class="sheet-drag-handle"></div>
        <h2 class="sheet-title" id="txt-add-title">Add New Place</h2>
        <p class="sheet-category" id="txt-add-subtitle">Select location on map, then fill fields</p>

        <div class="form-group">
            <label id="lbl-location">Location</label>
            <button type="button" class="btn-primary" style="margin-bottom: 10px;" onclick="startLocationPick()" id="btn-pick-location">
                📍 <span id="txt-pick-location">Choose on map</span>
            </button>
            <div id="chosen-coords" style="font-size: 13px; color: var(--hint-color); display: none;">
                <span id="coords-label"></span>
            </div>
        </div>

        <div class="form-group">
            <label id="lbl-name">Name</label>
            <!-- maxlength="50": enforces character limit at browser level (Step 1) -->
            <input type="text" id="add-name" class="form-control"
                   placeholder="Doggo Cafe" maxlength="50" autocomplete="off">
        </div>
        <div class="form-group">
            <label id="lbl-category">Category</label>
            <select id="add-category" class="form-control">
                <option value="cafe">Cafe</option>
                <option value="restaurant">Restaurant</option>
                <option value="park">Park</option>
                <option value="mall">Shopping Mall</option>
                <option value="vet">Vet Clinic</option>
            </select>
        </div>
        <div class="form-group">
            <label id="lbl-comment">Comment (optional)</label>
            <textarea id="add-comment" class="form-control" rows="2" placeholder="Dogs are welcome inside!"></textarea>
        </div>
        <button class="btn-primary" onclick="submitNewPlace()" id="btn-submit">Submit Place</button>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
