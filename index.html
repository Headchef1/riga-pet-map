<!DOCTYPE html>
<html>
  <head>
    <title>Riga Pet Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Подключаем стили карты Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #map {
        height: 100vh;
        width: 100%;
      }

      /* Стили для всплывающего окна */
      .popup-content {
        min-width: 200px;
        max-width: 250px;
      }
      .popup-img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 8px;
        display: block;
      }
      .popup-title {
        margin: 0 0 5px;
        font-size: 16px;
        font-weight: bold;
      }
      .popup-category {
        font-style: italic;
        color: #666;
        font-size: 13px;
        display: block;
        margin-bottom: 5px;
      }
      .popup-comment {
        font-size: 14px;
        margin: 8px 0;
        color: #333;
        line-height: 1.4;
      }
      .route-btn {
        display: block;
        text-align: center;
        background: #0088cc; /* Цвет Telegram */
        color: white !important;
        padding: 10px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        margin-top: 10px;
        font-size: 14px;
      }
      .route-btn:hover {
        background: #006699;
      }
      /* Кнопка геолокации в правом нижнем углу */
      .locate-btn {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 1000; /* Чтобы была поверх карты */
        background: white;
        border: 2px solid rgba(0, 0, 0, 0.2);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .locate-btn:active {
        background: #f0f0f0;
        transform: translateY(2px);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <!-- Кнопка "Найти меня" -->
    <button class="locate-btn" onclick="findUserLocation()">📍</button>
    <!-- Подключаем скрипты: Leaflet и парсер CSV -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <script>
      // 1. Инициализация карты (Координаты центра Риги)
      var map = L.map('map').setView([56.9496, 24.1052], 13);

      // 2. Добавляем слой карты (OpenStreetMap)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
      }).addTo(map);

      // 3. Ссылка на твою Google Таблицу (через CORS-прокси для надежности, если локально)
      // Можно вернуть прямую ссылку, если уже работало локально
      var googleSheetCSV =
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwZgrpWxkAs2G_aMBWNpPvYAOLa2WrnyXI2RvvkpK59SsAVkxj46d296AlU_Jet0O8wI9ZRORt1MMN/pub?gid=0&single=true&output=csv';

      // 4. Загрузка данных
      Papa.parse(googleSheetCSV, {
        download: true,
        header: true,
        complete: function (results) {
          results.data.forEach(function (place) {
            // Защита от пустых строк и ошибок в числах
            var latStr = String(place.Lat).replace(',', '.');
            var lonStr = String(place.Lon).replace(',', '.');
            var lat = parseFloat(latStr);
            var lon = parseFloat(lonStr);

            // Если координаты корректны
            if (!isNaN(lat) && !isNaN(lon)) {
              // --- 1. ВЫБОР ЦВЕТА ---
              var pointColor = '#3388ff'; // Синий (стандартный)

              // Если категория содержит слово "Park" (даже Park, park, PARK)
              var cat = (place.Category || '').toLowerCase();

              if (cat.includes('park')) pointColor = '#28a745'; // Зеленый
              if (cat.includes('vet')) pointColor = '#dc3545'; // Красный
              if (cat.includes('cafe')) pointColor = '#fd7e14'; // Оранжевый (Магазины/ТЦ)
              if (cat.includes('tc')) pointColor = '#007bff'; // Синий

              // --- 2. СОЗДАНИЕ МАРКЕРА ---
              var marker = L.circleMarker([lat, lon], {
                radius: 9,
                fillColor: pointColor,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.85,
              }).addTo(map);

              // --- 3. НАПОЛНЕНИЕ POPUP ---
              // Картинка (если есть ссылка)
              var imgHtml = place['Photo URL']
                ? `<img src="${place['Photo URL']}" class="popup-img" alt="${place.Name}">`
                : '';

              // Комментарий (если есть)
              var commentHtml = place.Comment
                ? `<div class="popup-comment">${place.Comment}</div>`
                : '';

              var popupContent = `
                <div class="popup-content">
                    ${imgHtml}
                    <div class="popup-title">${place.Name}</div>
                    <span class="popup-category">${place.Category}</span>
                    ${commentHtml}
                    <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" class="route-btn">
                       🚗 Get here
                    </a>
                </div>
              `;

              marker.bindPopup(popupContent);
            }
          });
        },
        error: function (err) {
          console.error('Ошибка загрузки CSV:', err);
        },
      });
      // --- ФУНКЦИЯ ГЕОЛОКАЦИИ ---
      var userMarker = null; // Переменная для хранения маркера пользователя

      function findUserLocation() {
        if (!navigator.geolocation) {
          alert('Ваш браузер/Telegram не поддерживает геолокацию 😢');
          return;
        }

        // Показываем, что ищем (можно поменять иконку на спиннер, но пока просто alert)
        // alert("Ищем вас...");

        navigator.geolocation.getCurrentPosition(
          // Успех
          function (position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;

            // 1. Удаляем старый маркер, если был
            if (userMarker) {
              map.removeLayer(userMarker);
            }

            // 2. Рисуем точку "Я здесь" (Пульсирующая или просто отличная от других)
            // Используем стандартный синий маркер Leaflet, но можно кастомный
            userMarker = L.marker([lat, lon]).addTo(map);

            userMarker.bindPopup('<b>Вы здесь!</b> 🐶').openPopup();

            // 3. Плавно перелетаем картой к пользователю
            map.flyTo([lat, lon], 15, {
              animate: true,
              duration: 1.5, // секунды
            });
          },
          // Ошибка
          function (error) {
            console.error(error);
            alert(
              'Не удалось определить местоположение. Проверьте настройки прав доступа в телефоне.'
            );
          },
          // Настройки точности
          {
            enableHighAccuracy: true, // Просим GPS (точно), а не просто Wi-Fi
            timeout: 10000, // Ждем максимум 10 секунд
            maximumAge: 0, // Не берем старые кэшированные данные
          }
        );
      }
    </script>
  </body>
</html>
