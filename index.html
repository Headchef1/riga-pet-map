<!DOCTYPE html>
<html>
  <head>
    <title>Riga Pet Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Подключаем стили карты Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #map {
        height: 100vh;
        width: 100%;
      }

      /* Стили для всплывающего окна */
      .popup-content {
        min-width: 200px;
        max-width: 250px;
      }
      .popup-img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 8px;
        display: block;
      }
      .popup-title {
        margin: 0 0 5px;
        font-size: 16px;
        font-weight: bold;
      }
      .popup-category {
        font-style: italic;
        color: #666;
        font-size: 13px;
        display: block;
        margin-bottom: 5px;
      }
      .popup-comment {
        font-size: 14px;
        margin: 8px 0;
        color: #333;
        line-height: 1.4;
      }
      .route-btn {
        display: block;
        text-align: center;
        background: #0088cc; /* Цвет Telegram */
        color: white !important;
        padding: 10px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        margin-top: 10px;
        font-size: 14px;
      }
      .route-btn:hover {
        background: #006699;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- Подключаем скрипты: Leaflet и парсер CSV -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <script>
      // 1. Инициализация карты (Координаты центра Риги)
      var map = L.map('map').setView([56.9496, 24.1052], 13);

      // 2. Добавляем слой карты (OpenStreetMap)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
      }).addTo(map);

      // 3. Ссылка на твою Google Таблицу (через CORS-прокси для надежности, если локально)
      // Можно вернуть прямую ссылку, если уже работало локально
      var googleSheetCSV =
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwZgrpWxkAs2G_aMBWNpPvYAOLa2WrnyXI2RvvkpK59SsAVkxj46d296AlU_Jet0O8wI9ZRORt1MMN/pub?gid=0&single=true&output=csv';

      // 4. Загрузка данных
      Papa.parse(googleSheetCSV, {
        download: true,
        header: true,
        complete: function (results) {
          results.data.forEach(function (place) {
            // Защита от пустых строк и ошибок в числах
            var latStr = String(place.Lat).replace(',', '.');
            var lonStr = String(place.Lon).replace(',', '.');
            var lat = parseFloat(latStr);
            var lon = parseFloat(lonStr);

            // Если координаты корректны
            if (!isNaN(lat) && !isNaN(lon)) {
              // --- 1. ВЫБОР ЦВЕТА ---
              var pointColor = '#3388ff'; // Синий (стандартный)

              // Если категория содержит слово "Park" (даже Park, park, PARK)
              var cat = (place.Category || '').toLowerCase();

              if (cat.includes('park')) pointColor = '#28a745'; // Зеленый
              if (cat.includes('vet')) pointColor = '#dc3545'; // Красный
              if (cat.includes('shop') || cat.includes('tc'))
                pointColor = '#fd7e14'; // Оранжевый (Магазины/ТЦ)
              if (cat.includes('cafe')) pointColor = '#007bff'; // Синий

              // --- 2. СОЗДАНИЕ МАРКЕРА ---
              var marker = L.circleMarker([lat, lon], {
                radius: 9,
                fillColor: pointColor,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.85,
              }).addTo(map);

              // --- 3. НАПОЛНЕНИЕ POPUP ---
              // Картинка (если есть ссылка)
              var imgHtml = place['Photo URL']
                ? `<img src="${place['Photo URL']}" class="popup-img" alt="${place.Name}">`
                : '';

              // Комментарий (если есть)
              var commentHtml = place.Comment
                ? `<div class="popup-comment">${place.Comment}</div>`
                : '';

              var popupContent = `
                <div class="popup-content">
                    ${imgHtml}
                    <div class="popup-title">${place.Name}</div>
                    <span class="popup-category">${place.Category}</span>
                    ${commentHtml}
                    <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" class="route-btn">
                       🚗 Get here
                    </a>
                </div>
              `;

              marker.bindPopup(popupContent);
            }
          });
        },
        error: function (err) {
          console.error('Ошибка загрузки CSV:', err);
        },
      });
    </script>
  </body>
</html>
